<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRC Neurobiology of Cognition — Poster Review</title>
<style>
:root{
  --ink:#1F2937; --ink-soft:#3B4453; --paper:#FAF7F0; --card:#FFFFFF;
  --accent:#B5860C; --accent-soft:#F4E8C9; --muted:#6B7280; --border:#E4DFD3;
  --success:#3F6C51; --success-soft:#E3EEE6; --danger:#9B4A3F;
  --font-display: Georgia, 'Times New Roman', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 80px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:20;}
.brand{font-family:var(--font-display);font-size:18px;letter-spacing:0.2px;}
.brand small{display:block;font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;margin-top:2px;}
.who{font-size:13px;color:var(--muted);text-align:right;}
.who button{margin-left:8px;background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--ink-soft);cursor:pointer;}
.login-card{max-width:380px;margin:14vh auto 0;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:32px 28px;text-align:center;}
.login-card h1{font-family:var(--font-display);font-size:22px;margin:0 0 4px;}
.login-card p.sub{color:var(--muted);font-size:13px;margin:0 0 24px;}
.login-card input{width:100%;font-family:var(--font-mono);font-size:16px;letter-spacing:1px;text-align:center;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--paper);margin-bottom:12px;text-transform:lowercase;}
.login-card input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.btn{display:inline-block;background:var(--ink);color:#fff;border:none;padding:11px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-body);}
.btn:hover{background:var(--ink-soft);}
.btn:disabled{opacity:0.5;cursor:default;}
.btn.secondary{background:none;color:var(--ink);border:1px solid var(--border);}
.btn.secondary:hover{background:var(--accent-soft);}
.btn.full{width:100%;}
.error-msg{color:var(--danger);font-size:13px;margin-top:8px;min-height:16px;}
.tabs{display:flex;gap:4px;margin:20px 0 16px;border-bottom:1px solid var(--border);}
.tab{padding:10px 4px;margin-right:20px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;font-weight:500;}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);}
.section-label{font-family:var(--font-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;}
.poster-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;gap:12px;align-items:center;}
.poster-card:hover{border-color:var(--accent);}
.board-tag{font-family:var(--font-mono);font-size:12px;background:var(--paper);border:1px solid var(--border);border-radius:6px;padding:4px 7px;min-width:44px;text-align:center;color:var(--ink-soft);flex-shrink:0;}
.poster-meta{flex:1;min-width:0;}
.poster-title{font-size:14px;font-weight:500;margin:0 0 3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.poster-sub{font-size:12px;color:var(--muted);}
.track-pill{display:inline-block;font-size:10px;font-family:var(--font-mono);background:var(--accent-soft);color:#6B5312;padding:2px 7px;border-radius:20px;margin-top:4px;}
.status-pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;flex-shrink:0;}
.status-pill.done{background:var(--success-soft);color:var(--success);}
.status-pill.pending{background:var(--accent-soft);color:#6B5312;}
.review-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;}
.review-panel h2{font-family:var(--font-display);font-size:19px;margin:0 0 2px;}
.review-panel .presenter-line{font-size:13px;color:var(--muted);margin-bottom:16px;}
.criterion{margin-bottom:18px;}
.criterion-label{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;}
.criterion-hint{font-weight:400;color:var(--muted);font-size:12px;}
.dots{display:flex;gap:8px;}
.dot{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:var(--paper);cursor:pointer;font-family:var(--font-mono);font-size:14px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;}
.dot.active{background:var(--ink);border-color:var(--ink);color:#fff;}
textarea{width:100%;min-height:100px;border:1px solid var(--border);border-radius:8px;padding:10px;font-family:var(--font-body);font-size:14px;resize:vertical;background:var(--paper);}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
.save-row{display:flex;gap:10px;margin-top:16px;align-items:center;}
.save-status{font-size:12px;color:var(--muted);}
.optional-flag{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;background:var(--accent-soft);color:#6B5312;padding:3px 8px;border-radius:6px;margin-left:8px;}
.agg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.agg-card{background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:12px;}
.agg-num{font-family:var(--font-display);font-size:26px;}
.agg-label{font-size:11px;color:var(--muted);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.5px;}
.comment-block{background:var(--paper);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:10px;font-size:13.5px;}
.empty-state{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;}
.back-link{font-size:13px;color:var(--muted);cursor:pointer;margin-bottom:14px;display:inline-block;}
.back-link:hover{color:var(--ink);}
</style>
</head>

let session = { token: null, identity: null, view: null, activePoster: null, activeIsOptional: false };

function el(html){ const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function slugify(name){ return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function render(){
  const root = document.getElementById('root');
  root.innerHTML = '';
  if(!session.identity){
    root.appendChild(renderLogin());
  } else {
    root.appendChild(renderApp());
  }
}

function renderLogin(){
  const wrap = el(`
    <div class="wrap">
      <div class="login-card">
        <h1>Poster review</h1>
        <p class="sub">Neurobiology of Cognition &middot; GRC 2026</p>
        <input id="token-input" placeholder="enter your access code" autocomplete="off" />
        <button class="btn full" id="login-btn">Continue</button>
        <div class="error-msg" id="login-error"></div>
      </div>
    </div>
  `);
  const input = wrap.querySelector('#token-input');
  const btn = wrap.querySelector('#login-btn');
  const err = wrap.querySelector('#login-error');
  async function tryLogin(){
    const val = input.value.trim().toLowerCase();
    if(!val) return;
    btn.disabled = true;
    err.textContent = '';
    btn.textContent = 'Checking...';
    try{
      const snap = await getDoc(doc(db, 'tokens', val));
      if(!snap.exists()){
        err.textContent = "That code doesn't match anything. Check it and try again.";
        btn.disabled = false;
        btn.textContent = 'Continue';
        return;
      }
      session.token = val;
      session.identity = snap.data();
      session.view = session.identity.isReviewer ? 'reviewer' : 'presenter';
      render();
    } catch(e){
      console.error(e);
      err.textContent = "Couldn't reach the database. Check your connection and try again.";
      btn.disabled = false;
      btn.textContent = 'Continue';
    }
  }
  btn.addEventListener('click', tryLogin);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') tryLogin(); });
  return wrap;
}

function logout(){
  session = { token: null, identity: null, view: null, activePoster: null, activeIsOptional: false };
  render();
}

function renderApp(){
  const wrap = el(`<div></div>`);
  const top = el(`
    <div class="topbar">
      <div class="brand">Poster review<small>GRC neurobiology of cognition</small></div>
      <div class="who">${session.identity.name}<button id="logout-btn">Switch code</button></div>
    </div>
  `);
  top.querySelector('#logout-btn').addEventListener('click', logout);
  wrap.appendChild(top);

  const body = el(`<div class="wrap"></div>`);

  if(session.identity.isAdmin){
    body.appendChild(renderAdminDashboard());
  } else if(session.activePoster){
    body.appendChild(renderReviewForm(session.activePoster, session.activeIsOptional));
  } else if(session.identity.isReviewer && session.identity.isPresenter){
    body.appendChild(renderTabs());
    body.appendChild(session.view === 'reviewer' ? renderReviewerDashboard() : renderPresenterDashboard());
  } else if(session.identity.isReviewer){
    body.appendChild(renderReviewerDashboard());
  } else {
    body.appendChild(renderPresenterDashboard());
  }

  wrap.appendChild(body);
  return wrap;
}

function renderTabs(){
  const t = el(`
    <div class="tabs">
      <div class="tab" data-v="reviewer">My reviews</div>
      <div class="tab" data-v="presenter">My poster</div>
    </div>
  `);
  t.querySelectorAll('.tab').forEach(tab => {
    if(tab.dataset.v === session.view) tab.classList.add('active');
    tab.addEventListener('click', () => { session.view = tab.dataset.v; render(); });
  });
  return t;
}

function reviewDocId(posterId, reviewerName){
  return `${posterId}_${slugify(reviewerName)}`;
}

async function getReview(posterId, reviewerName){
  try{
    const snap = await getDoc(doc(db, 'reviews', reviewDocId(posterId, reviewerName)));
    return snap.exists() ? snap.data() : null;
  } catch(e){ console.error(e); return null; }
}
async function setReview(posterId, reviewerName, obj){
  try{
    await setDoc(doc(db, 'reviews', reviewDocId(posterId, reviewerName)), {
      ...obj, posterId, reviewerName,
    });
    return true;
  } catch(e){
    console.error('Failed to save review:', e);
    return false;
  }
}
async function getReviewsForPoster(posterId){
  try{
    const q = query(collection(db, 'reviews'), where('posterId', '==', posterId));
    const snap = await getDocs(q);
    return snap.docs.map(d => d.data());
  } catch(e){ console.error(e); return []; }
}
async function getAllReviews(){
  try{
    const snap = await getDocs(collection(db, 'reviews'));
    return snap.docs.map(d => d.data());
  } catch(e){ console.error(e); return []; }
}

function renderReviewerDashboard(){
  const container = el(`<div></div>`);
  const assigned = session.identity.reviewerAssignedPosters || [];

  container.appendChild(el(`<div class="section-label">Your assigned posters (${assigned.length})</div>`));
  const listNode = el(`<div id="assigned-list"></div>`);
  container.appendChild(listNode);
  assigned.forEach(pid => listNode.appendChild(posterCard(pid, false, true)));

  container.appendChild(el(`<div class="section-label">Browse and optionally review any poster</div>`));
  const browseWrap = el(`<div></div>`);
  const search = el(`<input id="browse-search" placeholder="search by title, presenter, or board number" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:12px;background:var(--card);" />`);
  browseWrap.appendChild(search);
  const browseList = el(`<div id="browse-list"></div>`);
  browseWrap.appendChild(browseList);
  container.appendChild(browseWrap);

  function renderBrowseList(filterText){
    browseList.innerHTML = '';
    const ft = (filterText||'').toLowerCase();
    Object.values(POSTERS).forEach(p => {
      if(assigned.includes(p.id)) return;
      const hay = (p.title + ' ' + p.presenter + ' ' + p.board).toLowerCase();
      if(ft && !hay.includes(ft)) return;
      browseList.appendChild(posterCard(p.id, true, false));
    });
  }
  renderBrowseList('');
  search.addEventListener('input', () => renderBrowseList(search.value));

  loadStatuses(listNode, assigned);
  return container;
}

function posterCard(pid, isOptional, checkStatus){
  const p = POSTERS[pid];
  const card = el(`
    <div class="poster-card" data-pid="${pid}">
      <div class="board-tag">${p.session === 'Monday/Tuesday' ? 'MT' : 'WT'}-${p.board}</div>
      <div class="poster-meta">
        <p class="poster-title">${p.title}</p>
        <p class="poster-sub">${p.presenter} &middot; ${p.affiliation}</p>
        <span class="track-pill">${p.track}</span>
      </div>
      <div class="status-pill pending" data-status-for="${pid}">${isOptional ? 'optional' : '...'}</div>
    </div>
  `);
  card.addEventListener('click', () => {
    session.activePoster = pid;
    session.activeIsOptional = isOptional;
    render();
  });
  return card;
}

async function loadStatuses(listNode, posterIds){
  for(const pid of posterIds){
    const review = await getReview(pid, session.identity.name);
    const badge = listNode.querySelector(`[data-status-for="${pid}"]`);
    if(!badge) continue;
    if(review && review.submitted){
      badge.textContent = 'submitted';
      badge.classList.remove('pending');
      badge.classList.add('done');
    } else if(review){
      badge.textContent = 'draft saved';
    } else {
      badge.textContent = 'not started';
    }
  }
}

const CRITERIA = [
  {key:'novelty', label:'Novelty', hint:'Original contribution to the field'},
  {key:'clarity', label:'Clarity', hint:'Poster communicates clearly'},
  {key:'rigor', label:'Rigor', hint:'Sound methods and analysis'},
  {key:'significance', label:'Significance', hint:'Impact and importance of the work'},
];

function renderReviewForm(pid, isOptional){
  const p = POSTERS[pid];
  const wrap = el(`<div></div>`);
  const back = el(`<span class="back-link">&larr; Back to your list</span>`);
  back.addEventListener('click', () => { session.activePoster = null; render(); });
  wrap.appendChild(back);

  const panel = el(`
    <div class="review-panel">
      <h2>${p.title} ${isOptional ? '<span class="optional-flag">optional review</span>' : ''}</h2>
      <p class="presenter-line">Board ${p.session === 'Monday/Tuesday' ? 'MT' : 'WT'}-${p.board} &middot; ${p.presenter} &middot; ${p.affiliation} &middot; <span class="track-pill">${p.track}</span></p>
      <div id="criteria-wrap"></div>
      <div class="criterion">
        <div class="criterion-label">Constructive comments <span class="criterion-hint">optional but encouraged</span></div>
        <textarea id="comment-box" placeholder="What worked well? What could be sharpened?"></textarea>
      </div>
      <div class="save-row">
        <button class="btn secondary" id="save-draft-btn">Save draft</button>
        <button class="btn" id="submit-btn">Submit review</button>
        <span class="save-status" id="save-status"></span>
      </div>
    </div>
  `);
  wrap.appendChild(panel);

  const scores = {};
  const critWrap = panel.querySelector('#criteria-wrap');
  CRITERIA.forEach(c => {
    const row = el(`
      <div class="criterion">
        <div class="criterion-label"><span>${c.label}</span><span class="criterion-hint">${c.hint}</span></div>
        <div class="dots" data-key="${c.key}">
          ${[1,2,3,4,5].map(n => `<div class="dot" data-val="${n}">${n}</div>`).join('')}
        </div>
      </div>
    `);
    row.querySelectorAll('.dot').forEach(d => {
      d.addEventListener('click', () => {
        scores[c.key] = parseInt(d.dataset.val);
        row.querySelectorAll('.dot').forEach(dd => {
          dd.classList.toggle('active', parseInt(dd.dataset.val) <= scores[c.key]);
        });
      });
    });
    critWrap.appendChild(row);
  });

  const commentBox = panel.querySelector('#comment-box');
  const statusEl = panel.querySelector('#save-status');

  getReview(pid, session.identity.name).then(existing => {
    if(existing){
      CRITERIA.forEach(c => {
        if(existing[c.key]){
          scores[c.key] = existing[c.key];
          const row = critWrap.querySelector(`.dots[data-key="${c.key}"]`);
          row.querySelectorAll('.dot').forEach(dd => {
            dd.classList.toggle('active', parseInt(dd.dataset.val) <= existing[c.key]);
          });
        }
      });
      commentBox.value = existing.comment || '';
      if(existing.submitted) statusEl.textContent = 'Previously submitted — editing will update your review.';
    }
  });

  async function doSave(submitted){
    statusEl.textContent = 'Saving...';
    const obj = {
      novelty: scores.novelty || null,
      clarity: scores.clarity || null,
      rigor: scores.rigor || null,
      significance: scores.significance || null,
      comment: commentBox.value,
      optional: isOptional,
      submitted: submitted,
      updatedAt: new Date().toISOString(),
    };
    const ok = await setReview(pid, session.identity.name, obj);
    statusEl.textContent = ok
      ? (submitted ? 'Submitted.' : 'Draft saved.')
      : 'Something went wrong saving — please try again.';
  }

  panel.querySelector('#save-draft-btn').addEventListener('click', () => doSave(false));
  panel.querySelector('#submit-btn').addEventListener('click', () => {
    const allScored = CRITERIA.every(c => scores[c.key]);
    if(!allScored){
      statusEl.textContent = 'Score all four criteria before submitting.';
      return;
    }
    doSave(true);
  });

  return wrap;
}

function renderPresenterDashboard(){
  const pid = session.identity.posterId;
  const p = POSTERS[pid];
  const container = el(`
    <div>
      <div class="section-label">Your poster</div>
      <div class="review-panel">
        <h2>${p.title}</h2>
        <p class="presenter-line">Board ${p.session === 'Monday/Tuesday' ? 'MT' : 'WT'}-${p.board} &middot; <span class="track-pill">${p.track}</span></p>
        <div id="agg-area"><p class="empty-state">Loading feedback...</p></div>
      </div>
    </div>
  `);

  (async () => {
    const allReviews = await getReviewsForPoster(pid);
    const reviews = allReviews.filter(r => r.submitted);
    const aggArea = container.querySelector('#agg-area');
    if(reviews.length === 0){
      aggArea.innerHTML = `<p class="empty-state">No submitted reviews yet. Check back once judging is underway.</p>`;
      return;
    }
    const avg = key => {
      const vals = reviews.map(r => r[key]).filter(v => v != null);
      return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : null;
    };
    const overall = CRITERIA.map(c => avg(c.key)).filter(v=>v!=null);
    const overallAvg = overall.length ? (overall.reduce((a,b)=>a+b,0)/overall.length) : null;

    let html = `<div class="section-label" style="margin-top:0;">Aggregate score &middot; ${reviews.length} review(s) in</div>`;
    html += `<div class="agg-grid">`;
    html += `<div class="agg-card" style="grid-column:1/-1;background:var(--accent-soft);">
      <div class="agg-num">${overallAvg ? overallAvg.toFixed(1) : '—'}<span style="font-size:14px;color:var(--muted);">/5</span></div>
      <div class="agg-label">Overall average</div>
    </div>`;
    CRITERIA.forEach(c => {
      const v = avg(c.key);
      html += `<div class="agg-card"><div class="agg-num">${v ? v.toFixed(1) : '—'}</div><div class="agg-label">${c.label}</div></div>`;
    });
    html += `</div>`;

    const comments = reviews.filter(r => r.comment && r.comment.trim());
    html += `<div class="section-label">Reviewer feedback</div>`;
    if(comments.length === 0){
      html += `<p class="empty-state">No written comments yet.</p>`;
    } else {
      comments.forEach(r => {
        html += `<div class="comment-block">${escapeHtml(r.comment)}</div>`;
      });
    }
    aggArea.innerHTML = html;
  })();

  return container;
}

function renderAdminDashboard(){
  const container = el(`
    <div>
      <div class="section-label">Overall completion</div>
      <div class="agg-grid" id="admin-summary">
        <div class="agg-card" style="grid-column:1/-1;"><p class="empty-state" style="padding:8px 0;">Loading...</p></div>
      </div>
      <div class="section-label">Poster rankings (3+ reviews in)</div>
      <p style="font-size:12px;color:var(--muted);margin:-6px 0 10px;">MT-01 (organizer's own poster) is excluded from the review process entirely for reviewer privacy — it won't appear anywhere in this app</p>
      <div id="admin-rankings"><p class="empty-state">Loading...</p></div>
      <div class="section-label">Posters below 3 submitted reviews</div>
      <div id="admin-poster-list"><p class="empty-state">Loading...</p></div>
    </div>
  `);

  (async () => {
    const allReviews = await getAllReviews();
    const reviewsByPoster = {};
    allReviews.forEach(r => {
      if(r.submitted && r.posterId !== 'TEST-01'){
        (reviewsByPoster[r.posterId] = reviewsByPoster[r.posterId] || []).push(r);
      }
    });
    const submittedByPoster = {};
    Object.entries(reviewsByPoster).forEach(([pid, revs]) => { submittedByPoster[pid] = revs.length; });

    const posterIds = Object.keys(POSTERS).filter(pid => pid !== 'TEST-01');
    const totalExpected = posterIds.length * 3;
    const totalDone = posterIds.reduce((sum,pid) => sum + Math.min(submittedByPoster[pid]||0, 3), 0);
    const postersComplete = posterIds.filter(pid => (submittedByPoster[pid]||0) >= 3).length;

    const summary = container.querySelector('#admin-summary');
    summary.innerHTML = `
      <div class="agg-card" style="background:var(--accent-soft);">
        <div class="agg-num">${totalDone}<span style="font-size:14px;color:var(--muted);"> / ${totalExpected}</span></div>
        <div class="agg-label">Reviews submitted</div>
      </div>
      <div class="agg-card">
        <div class="agg-num">${postersComplete}<span style="font-size:14px;color:var(--muted);"> / ${posterIds.length}</span></div>
        <div class="agg-label">Posters fully reviewed</div>
      </div>
    `;

    // --- Rankings: posters with >= 3 submitted reviews, sorted by overall average score ---
    // (MT-01 is excluded from POSTERS entirely upstream, so no filter needed here)
    const rankingsEl = container.querySelector('#admin-rankings');
    const ranked = posterIds
      .filter(pid => (submittedByPoster[pid]||0) >= 3)
      .map(pid => {
        const revs = reviewsByPoster[pid];
        const avg = key => {
          const vals = revs.map(r => r[key]).filter(v => v != null);
          return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : null;
        };
        const perCriterion = CRITERIA.map(c => avg(c.key));
        const validCriteria = perCriterion.filter(v => v != null);
        const overallAvg = validCriteria.length ? (validCriteria.reduce((a,b)=>a+b,0)/validCriteria.length) : null;
        return { pid, overallAvg, perCriterion, numReviews: revs.length };
      })
      .sort((a,b) => (b.overallAvg||0) - (a.overallAvg||0));

    if(ranked.length === 0){
      rankingsEl.innerHTML = `<p class="empty-state">No posters have 3+ submitted reviews yet.</p>`;
    } else {
      rankingsEl.innerHTML = ranked.map((x, i) => {
        const p = POSTERS[x.pid];
        const breakdown = CRITERIA.map((c, ci) => `${c.label} ${x.perCriterion[ci] != null ? x.perCriterion[ci].toFixed(1) : '—'}`).join(' &middot; ');
        return `<div class="poster-card" style="cursor:default;">
          <div class="board-tag" style="font-size:15px;font-weight:700;min-width:28px;">${i+1}</div>
          <div class="poster-meta">
            <p class="poster-title">${p.title}</p>
            <p class="poster-sub">${p.presenter} &middot; ${p.session === 'Monday/Tuesday' ? 'MT' : 'WT'}-${p.board} &middot; ${x.numReviews} review(s)</p>
            <p class="poster-sub" style="margin-top:3px;">${breakdown}</p>
          </div>
          <div class="status-pill done" style="font-size:14px;">${x.overallAvg.toFixed(1)}</div>
        </div>`;
      }).join('');
    }

    const posterListEl = container.querySelector('#admin-poster-list');
    const incomplete = posterIds
      .map(pid => ({pid, done: Math.min(submittedByPoster[pid]||0, 3)}))
      .filter(x => x.done < 3)
      .sort((a,b) => a.done - b.done);
    if(incomplete.length === 0){
      posterListEl.innerHTML = `<p class="empty-state">Every poster has all reviews in.</p>`;
    } else {
      posterListEl.innerHTML = incomplete.map(x => {
        const p = POSTERS[x.pid];
        return `<div class="poster-card" style="cursor:default;">
          <div class="board-tag">${p.session === 'Monday/Tuesday' ? 'MT' : 'WT'}-${p.board}</div>
          <div class="poster-meta"><p class="poster-title">${p.title}</p><p class="poster-sub">${p.presenter}</p></div>
          <div class="status-pill pending">${x.done} / 3</div>
        </div>`;
      }).join('');
    }
  })();

  return container;
}

render();
</script>
</body>
</html>
